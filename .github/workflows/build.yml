name: build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: "Build manifest"
        required: false
        default: "79"
        type: choice
        options:
          - "79"
      arch:
        description: "Architecture"
        required: false
        default: "amd64"
        type: choice
        options:
          - "amd64"
          - "arm64"
      errata:
        description: "Kernel errata level"
        required: false
        default: "000"
        type: string
  push:
    tags:
      - "*.*-aws*"

permissions:
  contents: read

env:
  PACKER_VERSION: 1.15.4

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Compute build matrix
        id: matrix
        env:
          SELECT_BUILD: ${{ inputs.build || '79' }}
          SELECT_ARCH: ${{ inputs.arch || 'amd64' }}
          SELECT_ERRATA: ${{ inputs.errata || '000' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            matrix=$(jq -cn \
              --arg build "$SELECT_BUILD" \
              --arg arch "$SELECT_ARCH" \
              --arg errata "$SELECT_ERRATA" \
              '{include: [{
                build: $build,
                arch: $arch,
                errata: $errata,
                release: ($build + "-" + $errata + "-" + $arch + "-dev")
              }]}')
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            matrix=$(perl scripts/build-matrix.pl "$GITHUB_REF_NAME")
          else
            matrix=$(perl scripts/build-matrix.pl)
          fi
          printf '%s\n' "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.release }}
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-utils jq unzip
          wget -q "https://releases.hashicorp.com/packer/${PACKER_VERSION}/packer_${PACKER_VERSION}_linux_amd64.zip"
          sudo unzip -o "packer_${PACKER_VERSION}_linux_amd64.zip" -d /usr/local/bin
          packer version
      - name: Compute base image cache key
        id: base
        run: |
          echo "key=$(make -s cache-key BUILD="${{ matrix.build }}" ARCH="${{ matrix.arch }}")" >> "$GITHUB_OUTPUT"
      - name: Cache builder base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/builder-base/${{ matrix.build }}-${{ matrix.arch }}
          key: builder-${{ steps.base.outputs.key }}
      - name: Build bundle
        run: |
          make build \
            BUILD="${{ matrix.build }}" \
            ARCH="${{ matrix.arch }}" \
            RELEASE="${{ matrix.release }}" \
            ERRATA="${{ matrix.errata }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.release }}
          path: output/bundles/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/*.tgz
      - name: Publish release
        run: |
          tag="$GITHUB_REF_NAME"
          for asset in dist/*.tgz; do
            test -f "$asset"
            test -f "$asset.SHA256"
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" dist/*.tgz dist/*.tgz.SHA256 \
            --title "$tag" \
            --notes "OpenBSD AWS kernel bundle release $tag"
